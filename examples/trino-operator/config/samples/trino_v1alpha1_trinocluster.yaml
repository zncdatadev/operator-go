apiVersion: trino.kubedoop.dev/v1alpha1
kind: TrinoCluster
metadata:
  name: demo-trino
  labels:
    # commons-operator restarter delivers ConfigMap changes to running processes.
    # Enabling it for the first time also stamps the workload and triggers a rollout.
    restarter.kubedoop.dev/enable: "true"
spec:
  image:
    repo: quay.io/zncdatadev
    productVersion: "476"
    kubedoopVersion: 0.0.0-dev
    pullPolicy: IfNotPresent
  clusterConfig:
    nodeEnvironment: kubedoop
    stopped: false
    reconciliationPaused: false
  coordinators:
    roleConfig:
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 0
    config:
      gracefulShutdownTimeout: 30s
      resources:
        cpu: {min: 500m, max: "2"}
        memory: {limit: 1536Mi}
    podOverrides:
      spec:
        automountServiceAccountToken: false
        containers:
          - name: vector
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 200m, memory: 128Mi}
    roleGroups:
      default:
        replicas: 1
  workers:
    replicas: 1
    roleConfig:
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
    config:
      gracefulShutdownTimeout: 30s
      resources:
        cpu: {min: 500m, max: "2"}
        memory: {limit: 1536Mi}
      logging:
        enableVectorAgent: true
        containers:
          trino:
            console: {level: "OFF"}
            file: {level: TRACE}
            loggers:
              ROOT: {level: INFO}
              io.trino: {level: INFO}
    podOverrides:
      spec:
        automountServiceAccountToken: false
        containers:
          - name: vector
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 200m, memory: 128Mi}
    roleGroups:
      default: {}
