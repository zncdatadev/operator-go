                description: |-
                  ClusterOperation controls operator behavior at runtime.
                  Allows pausing reconciliation or stopping the cluster gracefully.
                properties:
                  reconciliationPaused:
                    default: false
                    type: boolean
                  stopped:
                    default: false
                    type: boolean
                type: object
              image:
                description: |-
                  Image specifies the container image configuration for the product workload.
                  If not set, the product operator webhook should provide defaults.
                  When Custom is set, it takes precedence over Repo/ProductVersion/KubedoopVersion.
                properties:
                  custom:
                    description: |-
                      Custom is a fully qualified image reference (e.g. "my-registry.com/ns/product:3.4.1").
                      When set, Repo, ProductVersion and KubedoopVersion are ignored.
                    type: string
                  kubedoopVersion:
                    description: |-
                      KubedoopVersion is the version of the kubedoop operator stack (e.g. "0.2.0").
                      Used only when Custom is not set.
                    type: string
                  productVersion:
                    description: |-
                      ProductVersion is the version of the product to deploy (e.g. "3.4.1").
                      Used only when Custom is not set.
                    type: string
                  pullPolicy:
                    default: IfNotPresent
                    description: |-
                      PullPolicy defines the image pull policy for the container.
                      Defaults to IfNotPresent.
                    enum:
                    - Always
                    - Never
                    - IfNotPresent
                    type: string
                  repo:
                    description: |-
                      Repo is the image repository (e.g. "quay.io/kubedoop").
                      Used only when Custom is not set.
                    type: string
